<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#0d0f14"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#222834" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#2a3242" stroke-width="1.5" stroke-dasharray="3 5"/>
  
  <!-- Connections -->
  <line x1="256" y1="256" x2="160" y2="160" stroke="#4f5d75" stroke-width="2.5" stroke-opacity="0.8"/>
  <line x1="256" y1="256" x2="370" y2="190" stroke="#4f5d75" stroke-width="2.5" stroke-opacity="0.8"/>
  <line x1="256" y1="256" x2="210" y2="380" stroke="#4f5d75" stroke-width="2.5" stroke-opacity="0.8"/>
  <line x1="256" y1="256" x2="350" y2="340" stroke="#e07a5f" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.9"/>
  <line x1="160" y1="160" x2="110" y2="240" stroke="#4f5d75" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="370" y1="190" x2="420" y2="130" stroke="#4f5d75" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Outer nodes -->
  <circle cx="160" cy="160" r="18" fill="#1e2430" stroke="#60a5fa" stroke-width="3"/>
  <circle cx="370" cy="190" r="22" fill="#1e2430" stroke="#34d399" stroke-width="3"/>
  <circle cx="210" cy="380" r="16" fill="#1e2430" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="350" cy="340" r="14" fill="#1e2430" stroke="#e07a5f" stroke-width="2.5" stroke-dasharray="3 2"/>
  <circle cx="110" cy="240" r="10" fill="#2d3748" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="420" cy="130" r="12" fill="#2d3748" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Isolated nodes (chaos / unlinked) -->
  <circle cx="120" cy="390" r="9" fill="#1f242d" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="400" cy="410" r="11" fill="#1f242d" stroke="#64748b" stroke-width="1.5"/>
  
  <!-- Center root node: Yudhan -->
  <circle cx="256" cy="256" r="32" fill="#0d0f14" stroke="#ffffff" stroke-width="3.5"/>
  <circle cx="256" cy="256" r="14" fill="#f8fafc"/>
